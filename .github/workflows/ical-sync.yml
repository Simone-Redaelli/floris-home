# Sincronizza i calendari di Booking.com / Airbnb con il sito ogni 30 minuti.
#  1. legge i link .ics salvati nel pannello admin (Disponibilità → Calendari)
#  2. blocca sul sito le notti occupate sui portali
#  3. pubblica su GitHub Pages i file calendar*.ics da dare ai portali
# Serve il segreto FIREBASE_SERVICE_ACCOUNT_BASE64 (vedi README, sezione "Calendari Booking/Airbnb").
name: Sincronizza calendari

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ical-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installa
        working-directory: backend
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Sincronizza
        working-directory: backend
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: node scripts/ical-sync.js --out ../ical-out

      - name: Pubblica i file .ics sul sito
        run: |
          shopt -s nullglob
          files=(ical-out/*.ics)
          if [ ${#files[@]} -eq 0 ]; then echo "Niente da pubblicare"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1
          git worktree add pages origin/gh-pages
          # tolgo i vecchi calendari e copio i nuovi
          rm -f pages/calendar*.ics
          cp ical-out/*.ics pages/
          cd pages
          git add -A calendar*.ics
          # pubblico solo se cambiano le date (ignoro la data di generazione)
          if git diff --cached -I '^DTSTAMP:' --quiet; then echo "Calendari invariati"; exit 0; fi
          git commit -m "Aggiorna calendari"
          git push origin HEAD:gh-pages
